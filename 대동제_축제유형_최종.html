<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대동제 유형 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'HSJiptokki-Black';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/HSJiptokki-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --bg-deep:#120a2e;
    --bg-mid:#1c1046;
    --pink:#ff3d8a;
    --cyan:#41e6ff;
    --yellow:#ffd93d;
    --lime:#a6ff3d;
    --ink:#f5f2ff;
    --ink-dim:#b8aed8;
    --card:#1a1140;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans KR', sans-serif;
    background:
      radial-gradient(ellipse 60% 40% at 15% 10%, rgba(255,61,138,0.25), transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 15%, rgba(65,230,255,0.2), transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 100%, rgba(255,217,61,0.12), transparent 60%),
      linear-gradient(180deg, var(--bg-deep), var(--bg-mid));
    color:var(--ink);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));
    position:relative;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }
  /* floating light particles */
  .particle{
    position:fixed;
    border-radius:50%;
    filter:blur(1px);
    opacity:0.55;
    pointer-events:none;
    animation:float 9s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0px);}
    50%{ transform:translateY(-26px);}
  }
  .stage{
    width:min(100%, 430px);
    max-width:430px;
    position:relative;
    z-index:2;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--ink-dim);
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--pink);
    box-shadow:0 0 8px var(--pink);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  h1.title{
    font-family:'HSJiptokki-Black', 'Black Han Sans', sans-serif;
    font-size:clamp(28px, 7vw, 38px);
    text-align:center;
    line-height:1.3;
    letter-spacing:0.01em;
    margin-bottom:6px;
    color:var(--yellow);
    text-shadow:0 0 18px rgba(255,217,61,0.35);
  }
  .subtitle{
    text-align:center;
    color:var(--ink-dim);
    font-size:14.5px;
    margin-bottom:28px;
  }

  /* glowstick progress */
  .sticks{
    display:flex;
    justify-content:center;
    gap:9px;
    margin-bottom:26px;
  }
  .stick{
    width:26px;
    height:7px;
    border-radius:4px;
    background:rgba(255,255,255,0.08);
    transition:all .45s cubic-bezier(.2,.9,.3,1.2);
  }
  .stick.on{
    background:var(--stick-color, var(--pink));
    box-shadow:0 0 12px var(--stick-color, var(--pink)), 0 0 24px var(--stick-color, var(--pink));
    transform:scaleY(1.3);
  }

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:28px 20px 24px;
    backdrop-filter:blur(6px);
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }

  .q-count{
    font-size:12.5px;
    color:var(--yellow);
    font-weight:700;
    letter-spacing:0.06em;
    margin-bottom:10px;
  }
  .question{
    font-size:19px;
    font-weight:700;
    line-height:1.45;
    margin-bottom:22px;
    min-height:56px;
  }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .prev-btn{
    display:block;
    margin:16px auto 0;
    background:none;
    border:none;
    color:var(--ink-dim);
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    padding:6px 10px;
    transition:color .15s ease, opacity .15s ease;
    opacity:0;
    visibility:hidden;
  }
  .prev-btn.show{ opacity:1; visibility:visible; }
  .prev-btn:hover{ color:var(--ink); }
  .opt{
    text-align:left;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    padding:14px 16px;
    border-radius:13px;
    cursor:pointer;
    transition:all .18s ease;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .opt .num{
    width:22px; height:22px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
    flex-shrink:0;
  }
  .opt:hover{
    background:rgba(255,255,255,0.09);
    border-color:rgba(255,255,255,0.25);
    transform:translateX(3px);
  }
  .opt:active{ transform:scale(0.98); }
  .opt.picked{
    border-color:var(--pink);
    background:rgba(255,61,138,0.14);
  }

  /* result */
  .result{ display:none; text-align:center; }
  .result.show{ display:block; animation:pop .5s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop{ from{opacity:0; transform:scale(0.92) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);} }

  .badge{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--ink-dim);
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .result-emoji{
    font-size:54px;
    margin-bottom:6px;
    filter:drop-shadow(0 0 18px currentColor);
  }
  .result-name{
    font-family:'Black Han Sans', sans-serif;
    font-size:26px;
    margin-bottom:14px;
    line-height:1.3;
  }
  .result-desc{
    font-size:15px;
    color:var(--ink-dim);
    line-height:1.7;
    margin-bottom:22px;
    white-space:pre-line;
  }
  .result-tags{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
    margin-bottom:18px;
  }
  .result-tags span{
    font-size:12.5px;
    font-weight:700;
    padding:6px 11px;
    border-radius:999px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.14);
    color:var(--ink);
  }
  .result-detail{
    text-align:left;
    font-size:13.5px;
    line-height:1.75;
    color:var(--ink-dim);
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:16px 17px;
    margin-bottom:22px;
  }
  .result-bars{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:24px;
    text-align:left;
  }
  .result-bar-row{
    display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-dim);
  }
  .result-bar-label{ width:78px; flex-shrink:0; text-align:right;}
  .result-bar-track{
    flex:1; height:8px; border-radius:5px; background:rgba(255,255,255,0.07); overflow:hidden;
  }
  .result-bar-fill{
    height:100%; border-radius:5px; width:0%;
    transition:width 1s cubic-bezier(.2,.8,.3,1);
  }

  .result-share-notice{
    font-size:15px;
    font-weight:700;
    line-height:1.5;
    margin:4px 0 12px;
    color:var(--yellow);
    text-align:center;
  }

  .actions{ display:flex; gap:10px; }
  .btn{
    flex:1;
    padding:14px;
    border-radius:13px;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background:linear-gradient(92deg, var(--pink), var(--yellow));
    color:#1a0f2e;
  }
  .btn-secondary{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    color:var(--ink);
  }
  .btn:hover{ opacity:0.92; }


  .share-message{
    margin-top:16px;
    margin-bottom:10px;
    text-align:center;
    font-size:14px;
    font-weight:700;
    line-height:1.5;
    color:var(--yellow);
  }

  .insta-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    margin-top:12px;
    padding:14px;
    border-radius:13px;
    text-decoration:none;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    background:linear-gradient(92deg, #ff3d8a, #c73dff 45%, #41e6ff);
    transition:transform .15s ease, opacity .15s ease;
  }
  .insta-btn:hover{ opacity:0.9; }
  .insta-btn:active{ transform:scale(0.97); }
  .insta-btn svg{ width:17px; height:17px; flex-shrink:0; }

  footer{
    text-align:center;
    margin-top:18px;
    font-size:12px;
    color:rgba(255,255,255,0.28);
  }


  @media (max-width: 390px){
    body{ padding-left:12px; padding-right:12px; }
    h1.title{ font-size:29px; }
    .subtitle{ font-size:13px; margin-bottom:22px; }
    .sticks{ gap:5px; margin-bottom:20px; }
    .stick{ width:22px; height:6px; }
    .card{ padding:24px 16px 20px; border-radius:18px; }
    .question{ font-size:17px; margin-bottom:18px; }
    .opt{ font-size:14px; padding:12px 13px; }
    .result-name{ font-size:23px; }
    .result-desc{ font-size:14px; }
  }

  @media (min-width: 391px) and (max-width: 600px){
    .stage{ width:min(100%, 430px); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="eyebrow"><span class="dot"></span> 2026 대동제 스페셜</div>
  <h1 class="title">나의 대동제 유형은?</h1>
  <p class="subtitle">질문 8개, 1분이면 끝. 나의 축제 유형을 찾아볼까요? 🎇</p>

  <div class="sticks" id="sticks"></div>

  <div class="card">
    <!-- Quiz -->
    <div id="quizView">
      <div class="q-count" id="qCount">QUESTION 1 / 6</div>
      <div class="question" id="qText"></div>
      <div class="options" id="optWrap"></div>
      <button class="prev-btn" id="prevBtn" onclick="goPrev()">← 이전 답변 다시 고르기</button>
    </div>

    <!-- Result -->
    <div class="result" id="resultView">
      <div class="badge">RESULT</div>
      <div class="result-emoji" id="rEmoji"></div>
      <div class="result-name" id="rName"></div>
      <div class="result-desc" id="rDesc"></div>
      <div class="result-tags" id="rTags"></div>
      <div class="result-detail" id="rDetail"></div>
      <div class="result-bars" id="rBars"></div>
      <div class="result-share-notice">
        결과를 가온 인스타에 공유하고 추첨 응모하세요!
      </div>
      <a class="insta-btn" href="https://www.instagram.com/kaon.knuw/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="5.5" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="17.3" cy="6.7" r="1.15" fill="currentColor"/>
        </svg>
        강원대학교 원주 캠퍼스 가온 인스타 바로가기 !
      </a>
    </div>
  </div>

  <footer>친구들과 결과 비교해보세요 🔥</footer>
</div>

<script>
const TYPES = {
  A: { key:'A', color:'#ff3d8a', emoji:'🎤', name:'무대 찢는 축제 주인공',
       desc:'공연은 보는 게 아니라 즐기는 것!\n오늘의 주인공은 바로 당신.',
       tags:['#떼창필수', '#맨앞라인', '#텐션최고조'],
       detail:'무대 위 아티스트보다 목소리가 더 크게 들릴 것 같은 타입. 라인업 뜨는 순간부터 동선을 짜고, 맨 앞자리를 사수하기 위해서라면 일찍 줄 서는 것도 마다하지 않아요. 공연이 시작되면 그 누구보다 열정적으로 떼창하고 손을 흔드는, 오늘 축제의 진짜 주인공입니다.' },
  B: { key:'B', color:'#41e6ff', emoji:'📸', name:'추억 수집가',
       desc:'축제보다 사진이 더 중요해!\n오늘의 순간을 하나도 놓치지 않는 기록형.',
       tags:['#포토존순례', '#인생샷장인', '#기록의민족'],
       detail:'축제장에 발을 딛는 순간부터 머릿속엔 "어디서 찍지?" 생각뿐. 포토존은 물론이고 조명, 부스, 풍경까지 놓치지 않고 카메라에 담아요. 남들이 놀 때 각도를 재고 있지만, 덕분에 다음 날 단톡방에 제일 예쁜 사진을 뿌리는 사람이 됩니다.' },
  C: { key:'C', color:'#ffd93d', emoji:'🍻', name:'끝까지 살아남는 축제 생존러',
       desc:'시작부터 끝까지 체력 MAX!\n마지막까지 대동제를 즐긴다.',
       tags:['#체력왕', '#푸드트럭탐방', '#엔딩까지완주'],
       detail:'축제는 체력전이라는 걸 아는 사람. 맛집 부스부터 챙기고, 틈틈이 에너지를 보충하며 페이스를 조절해요. 남들이 하나둘 지쳐 빠질 때도 끝까지 자리를 지키다가, 결국 마지막 무대까지 완주하는 진정한 생존왕입니다.' },
  D: { key:'D', color:'#a6ff3d', emoji:'👫', name:'친구 따라 왔다가 찐으로 즐기는 유형',
       desc:'"나 별로 안 갈 건데?"라고 했지만\n누구보다 신나게 놀고 있는 당신.',
       tags:['#친구따라강남', '#은근흥부자', '#분위기메이커'],
       detail:'처음엔 시큰둥했지만 막상 오면 제일 신나 있는 타입. 어디를 가든 무엇을 하든 "누구랑 함께"인지가 가장 중요해서, 친구들과 함께라면 무대 앞도 푸드트럭도 다 좋아요. 정작 본인은 몰랐던 텐션을 축제에서 발견하는, 은근한 분위기 메이커입니다.' }
};

const QUESTIONS = [
  { q:"축제에 도착한 당신이 가장 먼저 확인하는 것은?",
    opts:[
      ["오늘의 공연 라인업","A"],
      ["친구들의 현재 위치","D"],
      ["축제 포토존 위치","B"],
      ["푸드트럭 인기 메뉴","C"]
    ] },

  { q:"좋아하는 아티스트가 무대에 올랐다! 당신은?",
    opts:[
      ["무대 앞자리로 빠르게 이동","A"],
      ["공연 사진부터 열심히 촬영","B"],
      ["친구들과 함께 크게 환호","D"],
      ["맛있는 음식과 편하게 관람","C"]
    ] },

  { q:"축제장에서 갑자기 자유시간이 생겼다면?",
    opts:[
      ["다음 공연 자리 미리 확보","A"],
      ["예쁜 포토존 찾아 사진 촬영","B"],
      ["친구들과 새로운 부스 탐방","D"],
      ["맛있는 간식부터 여유롭게 선택","C"]
    ] },

  { q:"슬슬 배가 고파졌다. 당신의 선택은?",
    opts:[
      ["공연 자리 지키며 조금 더 기다리기","A"],
      ["사진 찍기 좋은 메뉴 고르기","B"],
      ["친구들이 먹고 싶은 음식 따라가기","D"],
      ["인기 푸드트럭 찾아 맛있는 음식 먹기","C"]
    ] },

  { q:"친구가 갑자기 '여기서 사진 찍자!'라고 한다면?",
    opts:[
      ["사진보다 공연 자리 먼저 생각","A"],
      ["좋은 구도부터 빠르게 찾기","B"],
      ["친구들과 포즈 정해서 신나게 촬영","D"],
      ["맛있는 간식 들고 자연스럽게 촬영","C"]
    ] },

  { q:"예상치 못한 소나기가 내린다면?",
    opts:[
      ["비가 와도 공연장 앞자리 사수","A"],
      ["우산 쓰고 예쁜 사진 계속 촬영","B"],
      ["친구들과 비 피하며 재미있게 놀기","D"],
      ["천막 아래에서 맛있는 음식 찾기","C"]
    ] },

  { q:"축제가 끝난 후 가장 먼저 하고 싶은 것은?",
    opts:[
      ["오늘 공연 영상 다시 감상","A"],
      ["오늘 찍은 사진 예쁘게 정리","B"],
      ["친구들과 오늘 추억 이야기하기","D"],
      ["먹었던 음식 후기 찾아보기","C"]
    ] },

  { q:"다음 날 아침, 당신의 몸 상태는?",
    opts:[
      ["목이 쉬어도 공연 생각뿐","A"],
      ["사진 정리하며 추억 다시 보기","B"],
      ["친구들과 다음 축제 약속 잡기","D"],
      ["체력은 방전됐지만 끝까지 뿌듯","C"]
    ] }
];

let current = 0;
const scores = { A:0, B:0, C:0, D:0 };
const answers = []; // { type, optIndex } per answered question

const sticksWrap = document.getElementById('sticks');
QUESTIONS.forEach((_, i) => {
  const s = document.createElement('div');
  s.className = 'stick';
  s.id = 'stick' + i;
  sticksWrap.appendChild(s);
});

function renderQuestion(){
  const item = QUESTIONS[current];
  document.getElementById('qCount').textContent = `QUESTION ${current+1} / ${QUESTIONS.length}`;
  document.getElementById('qText').textContent = item.q;
  const wrap = document.getElementById('optWrap');
  wrap.innerHTML = '';
  const prevAnswer = answers[current]; // if re-visiting an already-answered question
  item.opts.forEach(([label, type], idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="num">${idx+1}</span><span>${label}</span>`;
    btn.onclick = () => selectOption(btn, type, idx);
    wrap.appendChild(btn);
  });

  const prevBtn = document.getElementById('prevBtn');
  prevBtn.classList.toggle('show', current > 0);
}

function selectOption(btn, type, idx){
  document.querySelectorAll('.opt').forEach(o => o.disabled = true);
  btn.classList.add('picked');
  scores[type]++;
  answers[current] = { type, optIndex: idx };

  const stick = document.getElementById('stick' + current);
  stick.style.setProperty('--stick-color', TYPES[type].color);
  stick.classList.add('on');

  setTimeout(() => {
    current++;
    if (current < QUESTIONS.length){
      renderQuestion();
    } else {
      showResult();
    }
  }, 380);
}

function goPrev(){
  if (current <= 0) return;
  current--;
  const prev = answers[current];
  if (prev){
    scores[prev.type]--;
    answers[current] = null;
  }
  const stick = document.getElementById('stick' + current);
  stick.classList.remove('on');
  renderQuestion();
}

function showResult(){
  document.getElementById('quizView').style.display = 'none';
  const resultView = document.getElementById('resultView');
  resultView.classList.add('show');

  let topKey = 'A';
  Object.keys(scores).forEach(k => { if (scores[k] > scores[topKey]) topKey = k; });
  const t = TYPES[topKey];

  document.getElementById('rEmoji').textContent = t.emoji;
  document.getElementById('rEmoji').style.color = t.color;
  document.getElementById('rName').textContent = t.name;
  document.getElementById('rName').style.color = t.color;
  document.getElementById('rDesc').textContent = t.desc;

  const tagsWrap = document.getElementById('rTags');
  tagsWrap.innerHTML = '';
  t.tags.forEach(tag => {
    const el = document.createElement('span');
    el.textContent = tag;
    el.style.color = t.color;
    tagsWrap.appendChild(el);
  });

  document.getElementById('rDetail').textContent = t.detail;

  const barsWrap = document.getElementById('rBars');
  barsWrap.innerHTML = '';
  Object.values(TYPES).forEach(tp => {
    const pct = Math.round((scores[tp.key] / QUESTIONS.length) * 100);
    const row = document.createElement('div');
    row.className = 'result-bar-row';
    row.innerHTML = `
      <div class="result-bar-label">${tp.emoji} ${tp.key}</div>
      <div class="result-bar-track"><div class="result-bar-fill" style="background:${tp.color}"></div></div>
      <div style="width:32px; text-align:right;">${pct}%</div>
    `;
    barsWrap.appendChild(row);
    requestAnimationFrame(() => {
      row.querySelector('.result-bar-fill').style.width = pct + '%';
    });
  });

  window.__lastResult = t;
}

function restart(){
  current = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  answers.length = 0;
  document.querySelectorAll('.stick').forEach(s => { s.classList.remove('on'); });
  document.getElementById('resultView').classList.remove('show');
  document.getElementById('quizView').style.display = 'block';
  renderQuestion();
}


// ambient floating particles
const colors = ['#ff3d8a', '#41e6ff', '#ffd93d', '#a6ff3d'];
for (let i = 0; i < 14; i++){
  const p = document.createElement('div');
  p.className = 'particle';
  const size = 3 + Math.random() * 5;
  p.style.width = size + 'px';
  p.style.height = size + 'px';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.top = Math.random() * 100 + 'vh';
  p.style.background = colors[i % colors.length];
  p.style.boxShadow = `0 0 ${size*3}px ${colors[i % colors.length]}`;
  p.style.animationDelay = (Math.random() * 5) + 's';
  p.style.animationDuration = (7 + Math.random() * 6) + 's';
  document.body.appendChild(p);
}

renderQuestion();
</script>
</body>
</html>
